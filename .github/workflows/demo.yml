name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  containment-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull sandbox image
        run: docker pull python:3.12-slim

      - name: Unit tests
        run: |
          pip install pytest requests
          python -m pytest tests/ -q

      - name: Blast Radius demo in real Docker sandbox
        run: python demo/blast_radius.py docker | tee demo-output.txt

      - name: Show containment flags actually used
        run: |
          echo "--- docker run flags the sandbox issues ---"
          grep -n 'docker", "run"' -A14 sandbox/docker_sandbox.py

      - name: End-to-end run through the web API
        run: |
          python orchestrator/app.py &
          sleep 3
          curl -s localhost:8080/api/health
          echo
          JID=$(curl -s -X POST localhost:8080/api/run \
            -H 'Content-Type: application/json' \
            -d '{"task":"fetch https://example.com and count the words in its title tag","sandbox":"docker"}' \
            | python -c "import json,sys;print(json.load(sys.stdin)['job'])")
          echo "job=$JID"
          for i in $(seq 1 30); do
            sleep 3
            R=$(curl -s localhost:8080/api/result/$JID)
            STATE=$(echo "$R" | python -c "import json,sys;print(json.load(sys.stdin).get('state',''))")
            [ "$STATE" = "done" ] || [ "$STATE" = "error" ] && break
          done
          echo "$R" | python -m json.tool | tee e2e-record.json
          echo "$R" | grep -q '"sandbox_destroyed": true' \
            && echo "E2E PASS: sandbox destroyed after task" \
            || echo "E2E record missing destroy flag"

      - uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: |
            demo-output.txt
            e2e-record.json
